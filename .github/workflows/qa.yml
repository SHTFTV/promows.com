name: QA — mailto & JSON-LD

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      preview_url:
        description: Preview URL to test (overrides auto-detection)
        required: false

concurrency:
  group: qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install QA dev deps
        run: bun add -d playwright fast-xml-parser

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Resolve preview URL
        id: preview
        env:
          MANUAL: ${{ github.event.inputs.preview_url }}
          # Optional org secret: stable Lovable preview URL for this project.
          LOVABLE_PREVIEW_URL: ${{ secrets.LOVABLE_PREVIEW_URL }}
        run: |
          URL="${MANUAL:-$LOVABLE_PREVIEW_URL}"
          if [ -z "$URL" ]; then
            echo "::error::No preview URL configured. Set the LOVABLE_PREVIEW_URL secret or pass preview_url via workflow_dispatch."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Testing against $URL"

      - name: Wait for preview to be reachable
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
        run: |
          for i in $(seq 1 60); do
            if curl -sfo /dev/null "$BASE_URL/"; then
              echo "preview reachable"; exit 0
            fi
            sleep 5
          done
          echo "::error::Preview not reachable at $BASE_URL"; exit 1

      - name: Restore previous JSON-LD snapshots (for diff)
        uses: actions/cache@v4
        with:
          path: qa-reports/jsonld/snapshots
          key: qa-jsonld-snapshots-${{ github.base_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            qa-jsonld-snapshots-${{ github.base_ref || github.ref_name }}-
            qa-jsonld-snapshots-

      - name: qa:mailto
        id: qa_mailto
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          QA_ONLY: ${{ vars.QA_ONLY }}
          QA_SKIP: ${{ vars.QA_SKIP }}
        run: node scripts/qa-mailto.mjs

      - name: qa:jsonld
        id: qa_jsonld
        if: always()
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
          QA_ONLY: ${{ vars.QA_ONLY }}
          QA_SKIP: ${{ vars.QA_SKIP }}
        run: node scripts/verify-jsonld.mjs

      - name: qa:report (summary.html)
        if: always()
        run: node scripts/qa-report-html.mjs

      - name: Upload QA artifacts
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports-pr-${{ github.event.pull_request.number || github.run_id }}
          path: qa-reports/
          if-no-files-found: ignore

      - name: Comment failing routes on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const preview = process.env.PREVIEW_URL;
            const artifactUrl = process.env.ARTIFACT_URL || process.env.RUN_URL;
            const lines = [`### QA failures against \`${preview}\``];

            const mailtoSummary = 'qa-reports/mailto/summary.json';
            if (fs.existsSync(mailtoSummary)) {
              const j = JSON.parse(fs.readFileSync(mailtoSummary, 'utf8'));
              if (j.failures?.length) {
                lines.push('', '**mailto (info@promows.com) not visible:**');
                for (const f of j.failures) {
                  lines.push(`- [\`${f.breakpoint}\` ${f.route} → ${f.region}](${preview}${f.route}) — HTTP ${f.status ?? '?'} — ${f.reason}${f.artifact ? ` — 📸 \`${f.artifact}\`` : ''}`);
                }
              }
            }

            const jsonldSummary = 'qa-reports/jsonld/summary.json';
            if (fs.existsSync(jsonldSummary)) {
              const j = JSON.parse(fs.readFileSync(jsonldSummary, 'utf8'));
              if (j.failures?.length) {
                lines.push('', '**JSON-LD schema failures (raw SSR HTML):**');
                for (const f of j.failures) {
                  const names = f.failedAssertions.map(a => `\`${a.name}\`: ${a.detail}`).join('; ');
                  lines.push(`- [${f.path}](${f.url}) — HTTP ${f.status} — types=[${(f.entityTypes||[]).join(',')}] — ${names}`);
                }
              }
            }

            if (lines.length === 1) lines.push('', '_No structured failure summary produced — see job logs._');
            lines.push('', `📦 [Download artifacts](${artifactUrl}) · 🔗 [Full run](${process.env.RUN_URL})`);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });

name: QA — mailto & JSON-LD

on:
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install QA dev deps
        run: bun add -d playwright fast-xml-parser

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Start preview server
        run: |
          bun run preview --port 8080 &
          echo $! > .preview.pid
          for i in {1..40}; do
            if curl -sfo /dev/null http://localhost:8080/; then
              echo "preview up"; exit 0
            fi
            sleep 1
          done
          echo "preview failed to start"; exit 1

      - name: qa:mailto
        id: qa_mailto
        env:
          BASE_URL: http://localhost:8080
        run: node scripts/qa-mailto.mjs

      - name: qa:jsonld
        id: qa_jsonld
        if: always()
        env:
          BASE_URL: http://localhost:8080
        run: node scripts/verify-jsonld.mjs

      - name: Stop preview server
        if: always()
        run: kill "$(cat .preview.pid)" || true

      - name: Upload QA failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: qa-reports/
          if-no-files-found: ignore

      - name: Comment failing routes on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const lines = ['### QA failures'];
            const mailto = 'qa-reports/mailto/summary.json';
            if (fs.existsSync(mailto)) {
              const j = JSON.parse(fs.readFileSync(mailto, 'utf8'));
              lines.push('', '**mailto (info@promows.com) not visible:**');
              for (const f of j.failures) {
                lines.push(`- \`[${f.breakpoint}] ${f.route}\` → ${f.region}: ${f.reason}`);
              }
            }
            const jsonldDir = 'qa-reports/jsonld';
            if (fs.existsSync(jsonldDir)) {
              const files = fs.readdirSync(jsonldDir).filter(f => f.endsWith('.json'));
              if (files.length) lines.push('', '**JSON-LD schema failures:**');
              for (const f of files) {
                const j = JSON.parse(fs.readFileSync(path.join(jsonldDir, f), 'utf8'));
                lines.push(`- \`${j.path}\` (HTTP ${j.status}) — ${j.reason}`);
              }
            }
            if (lines.length === 1) lines.push('', '_No structured failure summary produced — check job logs._');
            lines.push('', '_Artifacts uploaded as `qa-reports`._');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });
